<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101b35">
  <title>Langit Pagi — Petualangan Platformer</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: ui-rounded, "Segoe UI", system-ui, sans-serif;
      background: #101b35;
      color: #f6f7ff;
      font-synthesis: none;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 32px 18px;
      display: grid;
      place-items: center;
      background:
        radial-gradient(ellipse at 50% -15%, #304a78 0, transparent 56%),
        #101b35;
    }

    .game { width: min(100%, 980px); }

    .topbar {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 18px;
    }

    .eyebrow {
      margin: 0 0 6px;
      color: #a9c5ff;
      font-size: .76rem;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.8rem, 5vw, 2.7rem);
      letter-spacing: -.055em;
      line-height: 1;
    }

    .stats {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .stat, .restart {
      min-height: 42px;
      padding: 0 14px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid #ffffff20;
      border-radius: 14px;
      background: #ffffff0c;
      color: #f6f7ff;
      font: inherit;
      font-weight: 750;
    }

    .stat strong { color: #ffd76a; }

    .restart {
      cursor: pointer;
      transition: background .15s ease, transform .15s ease;
    }

    .restart:hover { background: #ffffff1a; }
    .restart:active { transform: scale(.96); }

    .screen {
      position: relative;
      overflow: hidden;
      border: 1px solid #ffffff26;
      border-radius: 22px;
      background: #8fdcf3;
      box-shadow: 0 28px 90px #050b1e75, 0 2px 0 #ffffff15 inset;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 9;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #10203a69;
      backdrop-filter: blur(5px);
      transition: opacity .2s ease, visibility .2s ease;
    }

    .overlay[hidden] {
      display: none;
    }

    .dialog {
      width: min(100%, 410px);
      padding: 30px;
      border: 1px solid #ffffff40;
      border-radius: 24px;
      background: #14233ded;
      box-shadow: 0 18px 60px #09112370;
      text-align: center;
    }

    .dialog .emoji { font-size: 2.5rem; }

    .dialog h2 {
      margin: 10px 0 8px;
      font-size: 1.8rem;
      letter-spacing: -.04em;
    }

    .dialog p {
      margin: 0;
      color: #c5d2e8;
      line-height: 1.6;
    }

    .start {
      min-height: 48px;
      margin-top: 22px;
      padding: 0 22px;
      border: 0;
      border-radius: 14px;
      background: #ffcf57;
      color: #292342;
      cursor: pointer;
      font: inherit;
      font-weight: 850;
      box-shadow: 0 4px 0 #cc9631;
      transition: transform .12s ease, box-shadow .12s ease;
    }

    .start:hover { transform: translateY(-2px); }
    .start:active { transform: translateY(2px); box-shadow: none; }

    .below {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 13px 4px 0;
      color: #a9b7d1;
      font-size: .88rem;
    }

    .below strong { color: #e7edff; }

    .touch-controls {
      position: absolute;
      right: 14px;
      bottom: 14px;
      left: 14px;
      display: none;
      align-items: end;
      justify-content: space-between;
      pointer-events: none;
    }

    .touch-group { display: flex; gap: 10px; }

    .touch-button {
      width: 58px;
      height: 58px;
      display: grid;
      place-items: center;
      border: 1px solid #ffffff70;
      border-radius: 18px;
      background: #1323419c;
      color: #fff;
      font-size: 1.4rem;
      font-weight: 850;
      touch-action: none;
      user-select: none;
      pointer-events: auto;
    }

    .touch-button.jump {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #f1b93de0;
      color: #312744;
      font-size: .82rem;
    }

    @media (pointer: coarse), (max-width: 700px) {
      body { padding: 22px 12px; }
      .topbar { align-items: center; }
      .stats { gap: 6px; }
      .stat, .restart { min-height: 38px; padding: 0 10px; border-radius: 12px; font-size: .88rem; }
      .touch-controls { display: flex; }
      .below { font-size: .78rem; }
      .dialog { padding: 22px; }
    }

    @media (max-width: 420px) {
      body { padding-inline: 8px; }
      .topbar { gap: 8px; }
      .eyebrow { font-size: .62rem; }
      .stats { gap: 5px; }
      .stat, .restart { min-height: 35px; padding-inline: 8px; font-size: .78rem; }
      .below span:last-child { display: none; }
    }
  </style>
</head>
<body>
  <main class="game">
    <header class="topbar">
      <div>
        <p class="eyebrow">Petualangan platformer</p>
        <h1>Langit Pagi</h1>
      </div>
      <div class="stats" aria-label="Statistik permainan">
        <div class="stat" aria-live="polite">✦ <strong id="coin-count">0 / 12</strong></div>
        <button class="restart" id="restart" type="button" aria-label="Mulai ulang permainan">↻ <span>Ulangi</span></button>
      </div>
    </header>

    <section class="screen" aria-label="Permainan Langit Pagi">
      <canvas id="game-canvas" width="960" height="540" aria-label="Area permainan platformer"></canvas>
      <div class="overlay" id="overlay">
        <div class="dialog">
          <div class="emoji" id="dialog-emoji">🌤️</div>
          <h2 id="dialog-title">Ayo bertualang!</h2>
          <p id="dialog-copy">Lompati jurang, hindari si bulat, dan kumpulkan bintang sampai ke ujung bukit.</p>
          <button class="start" id="start-button" type="button">Mulai bermain</button>
        </div>
      </div>
      <div class="touch-controls" aria-label="Kontrol sentuh">
        <div class="touch-group">
          <button class="touch-button" type="button" data-control="left" aria-label="Bergerak ke kiri">←</button>
          <button class="touch-button" type="button" data-control="right" aria-label="Bergerak ke kanan">→</button>
        </div>
        <button class="touch-button jump" type="button" data-control="jump" aria-label="Lompat">LOMPAT</button>
      </div>
    </section>

    <footer class="below">
      <span><strong>Gerak:</strong> A/D atau ←/→ &nbsp; <strong>Lompat:</strong> Spasi, W, atau ↑</span>
      <span>Kumpulkan bintang dan capai bendera!</span>
    </footer>
  </main>

  <script>
    (() => {
      const canvas = document.querySelector("#game-canvas");
      const ctx = canvas.getContext("2d");
      const overlay = document.querySelector("#overlay");
      const coinCount = document.querySelector("#coin-count");
      const startButton = document.querySelector("#start-button");
      const dialogEmoji = document.querySelector("#dialog-emoji");
      const dialogTitle = document.querySelector("#dialog-title");
      const dialogCopy = document.querySelector("#dialog-copy");
      const width = canvas.width;
      const height = canvas.height;
      const worldWidth = 2700;
      const gravity = 0.62;
      const platforms = [
        { x: 0, y: 480, w: 620, h: 80 },
        { x: 690, y: 425, w: 300, h: 115 },
        { x: 1030, y: 480, w: 405, h: 80 },
        { x: 1115, y: 385, w: 140, h: 18 },
        { x: 1310, y: 335, w: 145, h: 18 },
        { x: 1625, y: 480, w: 550, h: 80 },
        { x: 1710, y: 390, w: 155, h: 18 },
        { x: 1940, y: 330, w: 150, h: 18 },
        { x: 2240, y: 480, w: 460, h: 80 },
        { x: 2310, y: 390, w: 150, h: 18 }
      ];
      const coinSpots = [
        [190, 420], [300, 370], [465, 405], [740, 365], [850, 365], [1110, 425],
        [1170, 330], [1365, 280], [1515, 410], [1740, 335], [1990, 275], [2350, 335]
      ];
      const enemies = [
        { x: 385, y: 450, min: 350, max: 555, speed: 1.45, direction: 1, alive: true },
        { x: 1110, y: 450, min: 1050, max: 1390, speed: 1.25, direction: -1, alive: true },
        { x: 1810, y: 360, min: 1715, max: 1825, speed: 1.15, direction: -1, alive: true },
        { x: 2050, y: 450, min: 1980, max: 2130, speed: 1.5, direction: 1, alive: true }
      ];
      const input = { left: false, right: false, jump: false };
      const player = { x: 72, y: 420, w: 32, h: 42, vx: 0, vy: 0, grounded: false, facing: 1, invulnerable: 0 };
      let cameraX = 0;
      let coins = [];
      let collected = 0;
      let playing = false;
      let finished = false;
      let lastTime = 0;

      function reset() {
        player.x = 72;
        player.y = 420;
        player.vx = 0;
        player.vy = 0;
        player.grounded = false;
        player.facing = 1;
        player.invulnerable = 0;
        cameraX = 0;
        collected = 0;
        coins = coinSpots.map(([x, y]) => ({ x, y, taken: false, phase: Math.random() * Math.PI * 2 }));
        enemies.forEach((enemy, index) => {
          enemy.alive = true;
          enemy.x = [385, 1110, 1810, 2050][index];
          enemy.direction = index === 1 || index === 2 ? -1 : 1;
        });
        updateCoinCount();
        setDialog("🌤️", "Ayo bertualang!", "Lompati jurang, hindari si bulat, dan kumpulkan bintang sampai ke ujung bukit.", "Mulai bermain");
        playing = false;
        finished = false;
        overlay.hidden = false;
      }

      function updateCoinCount() {
        coinCount.textContent = `${collected} / ${coins.length}`;
      }

      function setDialog(emoji, title, copy, buttonText) {
        dialogEmoji.textContent = emoji;
        dialogTitle.textContent = title;
        dialogCopy.textContent = copy;
        startButton.textContent = buttonText;
      }

      function begin() {
        if (finished) reset();
        playing = true;
        overlay.hidden = true;
      }

      function overlaps(a, b) {
        return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
      }

      function respawn() {
        player.x = 72;
        player.y = 420;
        player.vx = 0;
        player.vy = 0;
        player.invulnerable = 80;
        cameraX = 0;
      }

      function update(delta) {
        const step = Math.min(delta / 16.67, 2);
        if (player.invulnerable > 0) player.invulnerable -= step;
        const acceleration = player.grounded ? 0.78 : 0.46;
        if (input.left) {
          player.vx -= acceleration * step;
          player.facing = -1;
        }
        if (input.right) {
          player.vx += acceleration * step;
          player.facing = 1;
        }
        if (!input.left && !input.right) player.vx *= Math.pow(player.grounded ? 0.76 : 0.94, step);
        player.vx = Math.max(-4.6, Math.min(4.6, player.vx));
        if (input.jump && player.grounded) {
          player.vy = -12.4;
          player.grounded = false;
        }
        input.jump = false;

        player.x += player.vx * step;
        for (const platform of platforms) {
          if (overlaps(player, platform)) {
            if (player.vx > 0) player.x = platform.x - player.w;
            else if (player.vx < 0) player.x = platform.x + platform.w;
            player.vx = 0;
          }
        }

        player.vy += gravity * step;
        player.vy = Math.min(player.vy, 13);
        player.y += player.vy * step;
        player.grounded = false;
        for (const platform of platforms) {
          if (!overlaps(player, platform)) continue;
          if (player.vy > 0) {
            player.y = platform.y - player.h;
            player.vy = 0;
            player.grounded = true;
          } else if (player.vy < 0) {
            player.y = platform.y + platform.h;
            player.vy = 0;
          }
        }
        player.x = Math.max(0, Math.min(worldWidth - player.w, player.x));

        for (const coin of coins) {
          if (coin.taken) continue;
          const bob = Math.sin(performance.now() / 300 + coin.phase) * 4;
          if (overlaps(player, { x: coin.x - 13, y: coin.y - 13 + bob, w: 26, h: 26 })) {
            coin.taken = true;
            collected += 1;
            updateCoinCount();
          }
        }

        for (const enemy of enemies) {
          if (!enemy.alive) continue;
          enemy.x += enemy.speed * enemy.direction * step;
          if (enemy.x < enemy.min || enemy.x > enemy.max) enemy.direction *= -1;
          const enemyBox = { x: enemy.x, y: enemy.y, w: 34, h: 30 };
          if (!overlaps(player, enemyBox) || player.invulnerable > 0) continue;
          if (player.vy > 1 && player.y + player.h - enemy.y < 20) {
            enemy.alive = false;
            player.vy = -8;
          } else {
            respawn();
          }
        }

        if (player.y > height + 100) respawn();
        if (player.x > 2585) {
          playing = false;
          finished = true;
          setDialog("🏁", "Sampai di puncak!", `Kamu mengumpulkan ${collected} dari ${coins.length} bintang. Hebat!`, "Main lagi");
          overlay.hidden = false;
        }
        cameraX = Math.max(0, Math.min(worldWidth - width, player.x - width * 0.36));
      }

      function roundedRect(x, y, w, h, radius) {
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, radius);
      }

      function drawBackground() {
        const sky = ctx.createLinearGradient(0, 0, 0, height);
        sky.addColorStop(0, "#86d9f0");
        sky.addColorStop(1, "#d1f0da");
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, width, height);

        ctx.fillStyle = "#fff2b8";
        ctx.beginPath();
        ctx.arc(780 - cameraX * 0.08, 93, 38, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#fff8d8";
        ctx.beginPath();
        ctx.arc(780 - cameraX * 0.08, 93, 51, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#fff2b8";
        ctx.beginPath();
        ctx.arc(780 - cameraX * 0.08, 93, 38, 0, Math.PI * 2);
        ctx.fill();

        for (let i = 0; i < 6; i++) {
          const x = ((i * 235 - cameraX * 0.16) % (width + 200)) - 80;
          const y = 90 + (i % 3) * 58;
          ctx.fillStyle = "#ffffff80";
          ctx.beginPath();
          ctx.ellipse(x, y, 35, 12, 0, 0, Math.PI * 2);
          ctx.ellipse(x + 23, y - 7, 24, 16, 0, 0, Math.PI * 2);
          ctx.ellipse(x + 47, y, 31, 11, 0, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.fillStyle = "#7fc9aa";
        ctx.beginPath();
        ctx.moveTo(0, 365);
        for (let x = 0; x <= width + 40; x += 40) {
          const y = 335 + Math.sin((x + cameraX * 0.22) / 115) * 30 + Math.sin(x / 57) * 10;
          ctx.lineTo(x, y);
        }
        ctx.lineTo(width, height);
        ctx.lineTo(0, height);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = "#62b995";
        ctx.beginPath();
        ctx.moveTo(0, 415);
        for (let x = 0; x <= width + 40; x += 40) {
          const y = 390 + Math.sin((x + cameraX * 0.34) / 83) * 22 + Math.cos(x / 72) * 9;
          ctx.lineTo(x, y);
        }
        ctx.lineTo(width, height);
        ctx.lineTo(0, height);
        ctx.closePath();
        ctx.fill();
      }

      function drawPlatform(platform) {
        const x = platform.x - cameraX;
        ctx.fillStyle = "#80583f";
        roundedRect(x, platform.y, platform.w, platform.h, 8);
        ctx.fill();
        ctx.fillStyle = "#67bd75";
        roundedRect(x, platform.y, platform.w, 13, 7);
        ctx.fill();
        ctx.fillStyle = "#8cdb8d";
        ctx.fillRect(x + 8, platform.y + 3, Math.max(0, platform.w - 16), 3);
        ctx.fillStyle = "#b47a51";
        for (let mark = 20; mark < platform.w; mark += 54) {
          ctx.fillRect(x + mark, platform.y + 25 + (mark % 3) * 10, 16, 4);
        }
      }

      function drawCoin(coin, time) {
        if (coin.taken) return;
        const x = coin.x - cameraX;
        const y = coin.y + Math.sin(time / 300 + coin.phase) * 4;
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(Math.sin(time / 450 + coin.phase) * 0.18);
        ctx.fillStyle = "#f2aa2f";
        ctx.beginPath();
        ctx.arc(0, 2, 12, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#ffdb66";
        ctx.beginPath();
        ctx.arc(0, 0, 10, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#fff3b4";
        ctx.beginPath();
        ctx.arc(-3, -3, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      function drawEnemy(enemy) {
        if (!enemy.alive) return;
        const x = enemy.x - cameraX;
        ctx.fillStyle = "#93416b";
        ctx.beginPath();
        ctx.ellipse(x + 17, enemy.y + 27, 18, 6, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#ed7694";
        ctx.beginPath();
        ctx.arc(x + 17, enemy.y + 15, 15, Math.PI, Math.PI * 2);
        ctx.lineTo(x + 32, enemy.y + 24);
        ctx.quadraticCurveTo(x + 17, enemy.y + 35, x + 2, enemy.y + 24);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = "#fff";
        ctx.beginPath();
        ctx.arc(x + 12, enemy.y + 16, 3, 0, Math.PI * 2);
        ctx.arc(x + 23, enemy.y + 16, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#382d48";
        ctx.beginPath();
        ctx.arc(x + 13, enemy.y + 17, 1.4, 0, Math.PI * 2);
        ctx.arc(x + 24, enemy.y + 17, 1.4, 0, Math.PI * 2);
        ctx.fill();
      }

      function drawPlayer() {
        const x = player.x - cameraX;
        const blink = player.invulnerable > 0 && Math.floor(player.invulnerable / 5) % 2 === 0;
        if (blink) return;
        ctx.fillStyle = "#17345633";
        ctx.beginPath();
        ctx.ellipse(x + 16, player.y + player.h + 2, 18, 5, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#ee914d";
        roundedRect(x + 3, player.y + 13, 26, 27, 9);
        ctx.fill();
        ctx.fillStyle = "#f5bd6a";
        roundedRect(x + 6, player.y + 2, 22, 23, 8);
        ctx.fill();
        ctx.fillStyle = "#8a534a";
        ctx.beginPath();
        ctx.ellipse(x + 17, player.y + 6, 13, 6, 0, Math.PI, Math.PI * 2);
        ctx.fill();
        ctx.fillRect(x + 5, player.y + 5, 24, 5);
        ctx.fillStyle = "#fff";
        const eyeX = player.facing > 0 ? x + 21 : x + 10;
        ctx.beginPath();
        ctx.arc(eyeX, player.y + 15, 3.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#283149";
        ctx.beginPath();
        ctx.arc(eyeX + player.facing, player.y + 15, 1.7, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#69446a";
        ctx.fillRect(x + 5, player.y + 37, 10, 5);
        ctx.fillRect(x + 19, player.y + 37, 10, 5);
      }

      function drawGoal() {
        const x = 2590 - cameraX;
        ctx.fillStyle = "#6c533e";
        ctx.fillRect(x, 367, 7, 113);
        ctx.fillStyle = "#f46868";
        ctx.beginPath();
        ctx.moveTo(x + 7, 369);
        ctx.lineTo(x + 58, 385);
        ctx.lineTo(x + 7, 401);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = "#fff";
        ctx.fillRect(x + 15, 378, 14, 5);
        ctx.fillRect(x + 15, 388, 14, 5);
      }

      function draw(time) {
        drawBackground();
        for (const platform of platforms) drawPlatform(platform);
        for (const coin of coins) drawCoin(coin, time);
        for (const enemy of enemies) drawEnemy(enemy);
        drawGoal();
        drawPlayer();
      }

      function frame(time) {
        const delta = lastTime ? time - lastTime : 16.67;
        lastTime = time;
        if (playing) update(delta);
        draw(time);
        requestAnimationFrame(frame);
      }

      function setKey(event, pressed) {
        const key = event.key.toLowerCase();
        if (["arrowleft", "arrowright", "arrowup", " "].includes(key)) event.preventDefault();
        if (key === "arrowleft" || key === "a") input.left = pressed;
        if (key === "arrowright" || key === "d") input.right = pressed;
        if (pressed && (key === "arrowup" || key === "w" || key === " ")) input.jump = true;
        if (pressed && key === "enter" && !playing) begin();
      }

      window.addEventListener("keydown", event => setKey(event, true));
      window.addEventListener("keyup", event => setKey(event, false));
      window.addEventListener("blur", () => {
        input.left = false;
        input.right = false;
      });
      startButton.addEventListener("click", begin);
      document.querySelector("#restart").addEventListener("click", reset);

      document.querySelectorAll("[data-control]").forEach(button => {
        const control = button.dataset.control;
        const press = event => {
          event.preventDefault();
          if (!playing && control !== "jump") begin();
          if (control === "jump") input.jump = true;
          else input[control] = true;
          if (button.setPointerCapture && event.pointerId !== undefined) button.setPointerCapture(event.pointerId);
        };
        const release = event => {
          event.preventDefault();
          if (control !== "jump") input[control] = false;
        };
        button.addEventListener("pointerdown", press);
        button.addEventListener("pointerup", release);
        button.addEventListener("pointercancel", release);
        button.addEventListener("lostpointercapture", release);
      });

      reset();
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
